name: Release DeckyEQ
# Push a tag such as 1.1.0 (no "v", like the other plugins). CI builds and tests the ZIP without write access, attests where it
# was built, and creates a DRAFT release. Publish the draft after the hardware checks in
# docs/VALIDATION.md; the in-plugin updater only sees published releases. The installed 1.0 and 1.1 updaters
# accept only an asset that github-actions[bot] uploaded, so a release ZIP must come from this workflow.
# scripts/package.mjs (in npm run check) refuses a tag that differs from the version or CHANGELOG's top section.
on:
  push:
    tags: ["*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No dependency install scripts run, except esbuild's binary check needed by Vitest.
      - run: npm ci --ignore-scripts && npm rebuild esbuild
      - run: npm run check
      - name: Release notes = this version's CHANGELOG section
        run: |
          awk -v head="## [$GITHUB_REF_NAME]" '
            /^## / { inside = (index($0, head) == 1); next }
            inside { lines[++n] = $0 }
            END { s = 1; while (s <= n && lines[s] == "") s++; e = n; while (e >= s && lines[e] == "") e--
                  for (i = s; i <= e; i++) print lines[i] }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/DeckyEQ-*.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/DeckyEQ-*.zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --draft --repo "$GITHUB_REPOSITORY" --title "DeckyEQ $GITHUB_REF_NAME" --notes-file release-notes.md
