name: Release DeckyEQ
# Push a tag such as v1.1.0 to build, test and publish the installation ZIP from CI.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Tag must match the plugin version
        run: test "v$(node -p "require('./plugin.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/DeckyEQ-*.zip artifacts/DeckyEQ-*.zip.sha256 --title "DeckyEQ $GITHUB_REF_NAME" --generate-notes
